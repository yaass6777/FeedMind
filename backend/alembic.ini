# Alembic configuration for FeedMind. Run Alembic commands from `backend/`.
#
# The database URL is NOT stored here. migrations/env.py reads the validated
# DATABASE_URL from app.core.config (environment variables / root .env), so no
# credentials live in this file.

[alembic]
# Paths are relative to this file, so they work from any working directory.
script_location = %(here)s/migrations
# Makes the `app` package importable from migrations/env.py.
prepend_sys_path = %(here)s
path_separator = os

# Migration file names: 2026_01_31_1200-<rev>_<slug>.py (sortable by date).
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Store revision timestamps in UTC.
timezone = UTC

[post_write_hooks]
# Lint-fix and format newly generated migrations with Ruff (`python -m ruff`).
hooks = ruff_fix, ruff_format

ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
# Keep at WARNING: INFO would log SQL statements and bound parameters.
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
